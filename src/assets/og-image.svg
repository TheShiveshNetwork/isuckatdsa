<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5f0"/>
      <stop offset="1" stop-color="#efebe4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3e4f"/>
      <stop offset="1" stop-color="#466582"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#2c3e4f" opacity="0.06">
    <circle cx="80" cy="80" r="4"/><circle cx="80" cy="160" r="4"/>
    <circle cx="80" cy="240" r="4"/><circle cx="80" cy="320" r="4"/>
    <circle cx="1120" cy="80" r="4"/><circle cx="1120" cy="160" r="4"/>
    <circle cx="1120" cy="240" r="4"/><circle cx="1120" cy="320" r="4"/>
    <circle cx="80" cy="400" r="4"/><circle cx="80" cy="480" r="4"/>
    <circle cx="80" cy="560" r="4"/><circle cx="1120" cy="400" r="4"/>
    <circle cx="1120" cy="480" r="4"/><circle cx="1120" cy="560" r="4"/>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="url(#accent)"/>

  <!-- top small label -->
  <text x="90" y="130" font-family="'Courier New', monospace" font-size="30" letter-spacing="4" fill="#2c3e4f" opacity="0.55" text-transform="uppercase">DATA STRUCTURES + ALGORITHMS</text>

  <!-- main headline -->
  <text x="90" y="260" font-family="'Courier New', monospace" font-weight="900" font-size="78" fill="#1a1a18">i suck at dsa</text>
  <text x="402" y="290" font-family="'Courier New', monospace" font-weight="900" font-size="54" fill="#466582">
    <tspan text-decoration="line-through">no more</tspan>
  </text>

  <!-- tagline -->
  <text x="90" y="400" font-family="Georgia, serif" font-size="44" fill="#2c3e4f">A wiki of DSA mental models &amp; patterns</text>
  <text x="90" y="470" font-family="Georgia, serif" font-size="44" fill="#2c3e4f">...for people who suck at dsa.</text>

  <!-- footer -->
  <rect x="90" y="545" width="1020" height="3" fill="#2c3e4f" opacity="0.25"/>
  <text x="90" y="590" font-family="'Courier New', monospace" font-size="30" letter-spacing="3" fill="#2c3e4f" opacity="0.8">isuckatdsa</text>
</svg>